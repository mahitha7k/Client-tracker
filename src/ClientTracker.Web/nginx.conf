events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # $uri/ makes directory requests (like /) fall through to the
            # `index` directive's index.html resolution before giving up -
            # `try_files $uri =404;` alone never resolves "/" to a file and
            # 404s immediately.
            try_files $uri $uri/ =404;
        }
    }
}
